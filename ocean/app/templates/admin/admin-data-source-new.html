{% extends 'base.html' %}
{% block title %}New Data Source{% endblock %}
{% block breadcrumbs %}
<li class="breadcrumb-item"><a href="{{ url_for('admin.admin_dashboard') }}">Admin</a></li>
<li class="breadcrumb-item active" aria-current="page">New data source</li>
{% endblock %}
{% block content %}
<div class="outer-div">
<h1>New Data Source</h1>
<form id="data-source-new-form" action="{{ url_for('admin.admin_data_source_insert') }}" method="post">
    {% set editing = False %}
    {% include 'admin/admin-data-source-template.html' %}
</form>
<script>
    ajaxifyForm(document.getElementById('data-source-new-form'), true, true, null, null);
</script>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Logger{% endblock %}
{% block breadcrumbs %}
<li class="breadcrumb-item"><a href="{{ url_for('admin.admin_dashboard') }}">Admin</a></li>
<li class="breadcrumb-item active" aria-current="page">Logger</li>
{% endblock %}
{% block head %}
<style>
        .console-output {
            font-family: monospace;
            white-space: pre-wrap;
            background-color: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .console-output code {
            font-size: 14px;
        }
    </style>
{% endblock %}
{% block content %}
<div class="outer-div">
    <h1>Logger</h1>
    <a href="{{ url_for('admin.admin_logger_download_log') }}">Download</a>
    <div class="console-output">
        <code>{{ log_string }}</code>
    </div>
</div>
{% endblock %}
